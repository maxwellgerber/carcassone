<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7FA08F" />
      <stop offset="100%" stop-color="#4F6B60" />
    </linearGradient>
    <pattern id="grassStipple" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.6" fill="#2C4F46" opacity="0.25" />
      <circle cx="7" cy="6" r="0.5" fill="#2C4F46" opacity="0.2" />
    </pattern>
    <linearGradient id="roadGrad" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="120" y2="0">
      <stop offset="0%" stop-color="#8A7C64" />
      <stop offset="50%" stop-color="#B7A98C" />
      <stop offset="100%" stop-color="#8A7C64" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8DFC7" />
      <stop offset="100%" stop-color="#C6B892" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8A7150" />
      <stop offset="100%" stop-color="#4F3F29" />
    </linearGradient>
    <linearGradient id="embossRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2E9D2" />
      <stop offset="100%" stop-color="#1F2E2B" />
    </linearGradient>
    <pattern id="crosshatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,8 L8,0" stroke="#1F2E2B" stroke-width="0.6" opacity="0.35" />
      <path d="M0,0 L8,8" stroke="#1F2E2B" stroke-width="0.6" opacity="0.35" />
    </pattern>
  </defs>

  <rect data-structural="true" data-role="field-base" x="0" y="0" width="200" height="200" fill="url(#grassGrad)" />
  <rect x="0" y="0" width="200" height="200" fill="url(#grassStipple)" />

  <path data-structural="true" data-role="road" data-group="0" d="M100,200 L100,100" fill="none" stroke="url(#roadGrad)" stroke-width="40" stroke-linecap="butt" />
  <path d="M100,200 L100,100" fill="none" stroke="#CDBE9E" stroke-width="3" stroke-dasharray="10 8" opacity="0.85" />
  <circle cx="93" cy="185" r="2" fill="#8A7C64" opacity="0.6" />
  <circle cx="108" cy="170" r="1.6" fill="#8A7C64" opacity="0.6" />
  <circle cx="91" cy="152" r="2" fill="#8A7C64" opacity="0.6" />
  <circle cx="109" cy="135" r="1.6" fill="#8A7C64" opacity="0.6" />
  <circle cx="92" cy="118" r="2" fill="#8A7C64" opacity="0.6" />
  <circle cx="107" cy="105" r="1.6" fill="#8A7C64" opacity="0.6" />

  <rect data-structural="true" data-role="monastery-footprint" x="70" y="80" width="60" height="44" fill="url(#wallGrad)" />

  <rect x="100" y="80" width="30" height="44" fill="url(#crosshatch)" opacity="0.6" />
  <rect x="93" y="104" width="14" height="20" fill="#3F3223" stroke="#1F2E2B" stroke-width="1" />
  <circle cx="100" cy="90" r="4" fill="#CDBE9E" stroke="#1F2E2B" stroke-width="1" />
  <rect x="70" y="80" width="60" height="44" fill="none" stroke="url(#embossRim)" stroke-width="2" />

  <path d="M62,80 L100,48 L138,80 Z" fill="url(#roofGrad)" stroke="#1F2E2B" stroke-width="1.2" />
  <path d="M100,48 L138,80 L100,80 Z" fill="url(#crosshatch)" opacity="0.55" />
  <line x1="100" y1="48" x2="62" y2="80" stroke="#CDBE9E" stroke-width="1.5" opacity="0.85" />

  <line x1="100" y1="48" x2="100" y2="39" stroke="#1F2E2B" stroke-width="1.5" />
  <line x1="96" y1="43" x2="104" y2="43" stroke="#1F2E2B" stroke-width="1.5" />

  <path d="M0,10 L10,0" stroke="#1F2E2B" stroke-width="1.2" fill="none" />
  <path d="M190,0 L200,10" stroke="#1F2E2B" stroke-width="1.2" fill="none" />
  <path d="M200,190 L190,200" stroke="#1F2E2B" stroke-width="1.2" fill="none" />
  <path d="M10,200 L0,190" stroke="#1F2E2B" stroke-width="1.2" fill="none" />

  <rect data-structural="true" data-role="tile-border" x="0.5" y="0.5" width="199" height="199" fill="none" stroke="#1F2E2B" stroke-width="1.5" />
</svg>
