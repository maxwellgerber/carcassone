name = "carcassonne-web"
main = "src/server/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# Room enumeration registry (Durable Objects can't be listed) and per-user display
# names (set once at first login). Create real namespaces before deploying:
#   npx wrangler kv namespace create ROOM_REGISTRY
#   npx wrangler kv namespace create USER_PROFILES
# then replace the ids below. `wrangler dev` simulates KV locally regardless of id.
[[kv_namespaces]]
binding = "ROOM_REGISTRY"
id = "34b246eb94744b08937c96ceb2035f33"

[[kv_namespaces]]
binding = "USER_PROFILES"
id = "e5585b4494674442a4b13ace69df07ca"

# OIDC + session config. OIDC_ISSUER/OIDC_CLIENT_ID are not secret and are the
# same for local dev and production, so they live here. OIDC_REDIRECT_URI
# differs per environment (localhost vs. the real deployed domain) so it's set
# per-environment instead: locally in .dev.vars, in production via
# `wrangler secret put` or a real value here once the domain is known.
# This client is public/PKCE-only — no OIDC_CLIENT_SECRET needed.
[vars]
OIDC_ISSUER = "https://pickle-magpie-2000.customers.us1.twilio.dev"
OIDC_CLIENT_ID = "ciam_client_01m1w8n5ppfkfb5phm969235sh"
# OIDC_REDIRECT_URI = "https://your-deployed-domain/auth/callback"

# Shared secret the MCP server (src/mcp/server.ts) authenticates with, so agents
# can play without an interactive OIDC login. Set via `wrangler secret put
# MCP_SERVICE_TOKEN` for a deployed environment; leaving it unset disables agent
# access entirely (the RPC surface only accepts human sessions).
# MCP_SERVICE_TOKEN = "generate-a-long-random-value"
