<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8FB09E"/>
      <stop offset="100%" stop-color="#4F6B60"/>
    </linearGradient>
    <pattern id="hatchA" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3E574D" stroke-width="0.6" opacity="0.3"/>
    </pattern>
    <pattern id="hatchB" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#2F473D" stroke-width="0.4" opacity="0.22"/>
    </pattern>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C4B79C"/>
      <stop offset="55%" stop-color="#B7A98C"/>
      <stop offset="100%" stop-color="#98896C"/>
    </linearGradient>
    <radialGradient id="hubGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#CDBE9E"/>
      <stop offset="60%" stop-color="#B7A98C"/>
      <stop offset="100%" stop-color="#8A7C64"/>
    </radialGradient>
    <clipPath id="hubClip"><circle cx="100" cy="100" r="22"/></clipPath>
  </defs>

  <rect data-structural="true" data-role="field-base" x="0" y="0" width="200" height="200" fill="url(#grassGrad)" />
